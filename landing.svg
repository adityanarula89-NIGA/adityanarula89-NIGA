<svg xmlns="http://www.w3.org/2000/svg" width="860" height="246" viewBox="0 0 860 246" role="img" aria-label="Animated welcome to Aditya Narula's GitHub profile" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); opacity: 0; } 12% { opacity: .65; } 88% { opacity: .65; } to { transform: translateY(190px); opacity: 0; } }
    @keyframes glitch { 0%, 82%, 100% { opacity: 0; transform: translate(0); } 84% { opacity: .75; transform: translate(4px,-1px); } 86% { opacity: 0; transform: translate(-3px,1px); } 88% { opacity: .55; transform: translate(2px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .72; } 98% { opacity: .92; } }
    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rain { from { transform: translateY(-42px); opacity: 0; } 12% { opacity: .7; } to { transform: translateY(220px); opacity: 0; } }
    @keyframes progress { from { width: 0; } to { width: 180px; } }
    @keyframes squares { from { opacity: .18; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(330px); } }
    .shell { animation: flicker 5.5s steps(1) infinite; }
    .line { opacity: 0; animation: reveal .45s ease-out forwards; }
    .cursor { animation: blink .8s steps(1) infinite; }
    .moving-cursor { animation: type 1.7s linear .8s infinite alternate; }
    .scanline { animation: scan 3.2s linear 1.8s infinite; }
    .glitch { animation: glitch 3.8s steps(1) 1.7s infinite; }
    .status { animation: pulse 1.1s ease-in-out infinite; }
    .rain { animation: rain 3.8s linear infinite; }
    .orbit { transform-origin: 748px 105px; animation: orbit 6s linear 1.7s infinite; }
    .progress { animation: progress 1.5s steps(12, end) 1.45s forwards; }
    .square { opacity: .18; transform-box: fill-box; transform-origin: center; animation: squares .25s ease-out forwards; }
    @media (prefers-reduced-motion: reduce) { .shell, .line, .cursor, .moving-cursor, .scanline, .glitch, .status, .rain, .orbit, .progress, .square { animation: none; } .line, .square { opacity: 1; } .scanline, .rain, .glitch, .moving-cursor { display: none; } .cursor { opacity: 1; } }
  </style>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d353"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#58a6ff"/></linearGradient></defs>
  <g class="shell">
    <rect width="860" height="246" rx="12" fill="url(#bg)"/><rect x=".5" y=".5" width="859" height="245" rx="12" fill="none" stroke="#30363d"/>
    <g class="rain" fill="#39d353" font-size="10" opacity=".42"><text x="610" y="45">0</text><text x="630" y="80">1</text><text x="650" y="25">0</text><text x="672" y="68">1</text><text x="695" y="38">1</text><text x="718" y="92">0</text><text x="740" y="45">1</text><text x="762" y="78">0</text><text x="785" y="28">1</text><text x="808" y="64">0</text></g>
    <line x1="0" y1="30" x2="860" y2="30" stroke="#30363d"/>
    <circle class="status" cx="20" cy="15" r="5" fill="#ff5f56"/><circle class="status" style="animation-delay:.2s" cx="36" cy="15" r="5" fill="#ffbd2e"/><circle class="status" style="animation-delay:.4s" cx="52" cy="15" r="5" fill="#27c93f"/>
    <text x="430" y="19" fill="#7d8590" font-size="12" text-anchor="middle">aditya@github: ~$ ./welcome.sh</text>
    <g class="orbit" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".8"><ellipse cx="748" cy="105" rx="90" ry="34"/><circle cx="838" cy="105" r="3" fill="#22d3ee"/><text x="742" y="62" fill="#39d353" stroke="none" font-size="13">✦</text><text x="742" y="153" fill="#58a6ff" stroke="none" font-size="13">⌁</text></g>
    <g class="line" style="animation-delay:.1s"><text x="28" y="64" fill="#7d8590" font-size="15">$ booting profile...</text><rect x="220" y="54" width="180" height="5" rx="2.5" fill="#21262d" stroke="#30363d"/><rect class="progress" x="220" y="54" height="5" rx="2.5" fill="url(#neon)"/></g>
    <g class="line" style="animation-delay:.45s"><text x="28" y="101" fill="#39d353" font-size="24" font-weight="700">Welcome, I'm Aditya Narula</text><text class="glitch" x="28" y="101" fill="#22d3ee" font-size="24" font-weight="700">Welcome, I'm Aditya Narula</text><text class="glitch" x="28" y="101" fill="#ff5f56" font-size="24" font-weight="700">Welcome, I'm Aditya Narula</text></g>
    <g class="line" style="animation-delay:.8s"><text x="28" y="130" fill="#58a6ff" font-size="16">AI Product Builder · turning ideas into useful things</text><text class="moving-cursor" x="28" y="130" fill="#22d3ee" font-size="16">▌</text></g>
    <g class="line" style="animation-delay:1.1s"><text x="28" y="159" fill="#c9d1d9" font-size="15">$ explore --profile <tspan fill="#f2cc60">ready</tspan><tspan class="cursor" fill="#c9d1d9">_</tspan></text><rect x="260" y="149" width="180" height="3" rx="1.5" fill="#21262d"/><rect class="progress" x="260" y="149" height="3" rx="1.5" fill="#39d353"/></g>
    <g class="line" style="animation-delay:1.4s"><text x="28" y="186" fill="#7d8590" font-size="12">[OK] identity   [OK] creativity   [OK] shipping</text></g>
    <g transform="translate(28 211)"><text fill="#7d8590" font-size="11">contributions // live signal</text><g transform="translate(186 0)"><rect class="square" style="animation-delay:1.5s" x="0" y="0" width="9" height="9" rx="2" fill="#0e4429"/><rect class="square" style="animation-delay:1.62s" x="14" y="0" width="9" height="9" rx="2" fill="#006d32"/><rect class="square" style="animation-delay:1.74s" x="28" y="0" width="9" height="9" rx="2" fill="#26a641"/><rect class="square" style="animation-delay:1.86s" x="42" y="0" width="9" height="9" rx="2" fill="#39d353"/><rect class="square" style="animation-delay:1.98s" x="56" y="0" width="9" height="9" rx="2" fill="#0e4429"/><rect class="square" style="animation-delay:2.1s" x="70" y="0" width="9" height="9" rx="2" fill="#26a641"/><rect class="square" style="animation-delay:2.22s" x="84" y="0" width="9" height="9" rx="2" fill="#39d353"/><rect class="square" style="animation-delay:2.34s" x="98" y="0" width="9" height="9" rx="2" fill="#006d32"/><rect class="square" style="animation-delay:2.46s" x="0" y="14" width="9" height="9" rx="2" fill="#26a641"/><rect class="square" style="animation-delay:2.58s" x="14" y="14" width="9" height="9" rx="2" fill="#39d353"/><rect class="square" style="animation-delay:2.7s" x="28" y="14" width="9" height="9" rx="2" fill="#0e4429"/><rect class="square" style="animation-delay:2.82s" x="42" y="14" width="9" height="9" rx="2" fill="#006d32"/><rect class="square" style="animation-delay:2.94s" x="56" y="14" width="9" height="9" rx="2" fill="#39d353"/><rect class="square" style="animation-delay:3.06s" x="70" y="14" width="9" height="9" rx="2" fill="#26a641"/><rect class="square" style="animation-delay:3.18s" x="84" y="14" width="9" height="9" rx="2" fill="#006d32"/><rect class="square" style="animation-delay:3.3s" x="98" y="14" width="9" height="9" rx="2" fill="#39d353"/></g></g>
    <rect class="scanline" x="28" y="36" width="804" height="2" fill="#22d3ee"/>
  </g>
</svg>
